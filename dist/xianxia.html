<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>问道长生</title>
<style>
/* 问道长生 - 国风水墨主题 */
:root {
  --bg: #0b0e14; --panel: rgba(20, 24, 33, .9); --line: rgba(216, 180, 90, .3);
  --gold: #d8b45a; --gold2: #f0d78c; --red: #cf5443; --jade: #5db596; --paper: #eadfc6; --dim: #8b8f99;
  --tint: #1e2a2f; --cw: 128px; --ch: 186px;
  color-scheme: dark;
  font-family: 'STKaiti', 'KaiTi', 'Kaiti SC', 'AR PL UKai CN', 'Songti SC', 'Noto Serif CJK SC', 'Source Han Serif SC', 'WenQuanYi Zen Hei', 'Microsoft YaHei', serif;
}
body[data-realm="0"] { --tint: #24463a; } body[data-realm="1"] { --tint: #47283f; } body[data-realm="2"] { --tint: #1f4266; }
body[data-realm="3"] { --tint: #562626; } body[data-realm="4"] { --tint: #4a4520; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--paper); }
body { font-size: 16px; }
body {
  background:
    radial-gradient(900px 520px at 50% -8%, color-mix(in srgb, var(--tint) 85%, #000), transparent 70%),
    radial-gradient(700px 400px at 12% 105%, color-mix(in srgb, var(--tint) 45%, #000), transparent 70%),
    linear-gradient(#0b0e14, #07090d);
  transition: background .6s;
}
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 160px rgba(0, 0, 0, .6); z-index: 1; }
#app { height: 100%; display: flex; flex-direction: column; position: relative; }
button { font-family: inherit; color: inherit; }
kbd { background: #2a2f3b; border: 1px solid #4a5060; border-radius: 4px; padding: 0 5px; font-size: .85em; }
small { color: var(--dim); }
b { font-weight: 700; }

/* ---------- 顶栏 ---------- */
.topbar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: linear-gradient(#141821, rgba(20, 24, 33, .75)); border-bottom: 1px solid var(--line); flex-wrap: wrap; z-index: 5; position: relative; }
.tb-id { display: flex; gap: 10px; align-items: center; } .tb-id b { font-size: 17px; display: block; line-height: 1.1; } .tb-id small { font-size: 12px; }
.badge { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; color: #fff; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 80%, #fff), color-mix(in srgb, var(--c) 45%, #000)); border: 2px solid var(--c); text-shadow: 0 1px 3px #000; }
.tb-stats { display: flex; gap: 14px; font-size: 18px; } .tb-stats .hp { color: #ff8b78; } .tb-stats .gold { color: var(--gold2); } .tb-stats small { font-size: 13px; }
.tb-potions, .tb-relics { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; } .tb-relics { flex: 1; min-width: 80px; }
.tb-btns { margin-left: auto; display: flex; gap: 6px; }
.ib { background: #232835; border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 15px; } .ib:hover:not(:disabled) { background: #2e3545; } .ib i { font-style: normal; color: var(--gold2); margin-left: 6px; } .ib:disabled { opacity: .35; cursor: default; }
.relic, .potion { width: 30px; height: 30px; border-radius: 7px; display: inline-grid; place-items: center; font-size: 17px; background: #232835; border: 1.5px solid #5a6072; cursor: help; color: #fff; flex: none; }
.relic.r-starter { border-color: #9fb3c8; } .relic.r-common { border-color: #9aa0ad; } .relic.r-uncommon { border-color: #6cb6ee; } .relic.r-rare { border-color: #f0c35a; background: #3a3020; } .relic.r-boss { border-color: #e26a5a; background: #3a2222; }
.potion { border-radius: 50% 50% 8px 8px; cursor: pointer; } .potion.empty { opacity: .3; border-style: dashed; cursor: default; }
.potion.p-common { border-color: #7fcf9f; background: #1f3329; } .potion.p-uncommon { border-color: #6cb6ee; background: #1d2b3a; } .potion.p-rare { border-color: #f0c35a; background: #3a3020; }

.screen { flex: 1; overflow: auto; position: relative; animation: fadeIn .35s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }

/* ---------- 通用面板 / 按钮 ---------- */
.panel { max-width: 1000px; margin: 22px auto; padding: 24px 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); position: relative; }
.panel h2 { margin: 0 0 12px; font-size: 30px; letter-spacing: 8px; color: var(--gold2); font-weight: 700; }
.panel h3 { margin: 18px 0 10px; font-size: 18px; letter-spacing: 4px; color: var(--gold); font-weight: 400; }
.flavor { color: #cfc6b0; line-height: 1.8; margin: 8px auto 18px; max-width: 640px; font-size: 17px; }
.gold-line { color: var(--gold2); font-size: 19px; margin: 6px 0; } .gold-line b { font-size: 24px; }
.btn { padding: 10px 24px; background: linear-gradient(#2d3242, #1b1f2b); border: 1px solid var(--line); color: var(--paper); border-radius: 8px; font-size: 17px; cursor: pointer; letter-spacing: 3px; transition: transform .12s, box-shadow .12s, filter .12s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0, 0, 0, .5); filter: brightness(1.15); } .btn:active:not(:disabled) { transform: none; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: linear-gradient(#cba043, #8e6520); border-color: var(--gold2); color: #fff; text-shadow: 0 1px 2px #000; }
.btn.danger { border-color: #a04040; } .btn.sm { padding: 6px 14px; font-size: 14px; letter-spacing: 1px; margin-top: 8px; }
.btn.big { display: block; width: 100%; max-width: 560px; margin: 10px auto; padding: 14px 20px; text-align: center; letter-spacing: 2px; }
.btn.big b { display: block; font-size: 18px; } .btn.big small { display: block; margin-top: 4px; letter-spacing: 1px; font-size: 13px; }
.btn small { color: inherit; opacity: .7; margin-left: 6px; }
.row-btns { display: flex; gap: 14px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
.loot { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 8px 0; text-align: left; font-size: 16px; } .loot small { font-size: 13px; }
.loot .relic, .loot .potion { width: 38px; height: 38px; font-size: 21px; }

/* ---------- 标题 ---------- */
.title-screen { position: relative; height: 100%; overflow: hidden; display: grid; place-items: center; }
.moon { position: absolute; top: 10%; right: 16%; width: clamp(80px, 12vw, 150px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #fffbe8, #e8d9a0 60%, #b8a566); box-shadow: 0 0 80px 20px rgba(240, 220, 150, .25); animation: breathe 8s infinite alternate; }
@keyframes breathe { to { box-shadow: 0 0 110px 34px rgba(240, 220, 150, .35); } }
.mount { position: absolute; bottom: 0; left: 0; width: 100%; } .m1 { height: 46%; fill: #121a24; opacity: .95; } .m2 { height: 32%; fill: #0b1119; }
.title-box { position: relative; z-index: 3; text-align: center; padding: 20px; }
.title-box h1 { font-size: clamp(56px, 11vw, 120px); margin: 0; letter-spacing: .28em; padding-left: .28em; font-weight: 700; background: linear-gradient(#fff6d2, #d8b45a 60%, #9a7428); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .8)); }
.sub { letter-spacing: 12px; color: var(--gold); margin: 6px 0 22px; font-size: 18px; } .poem { color: #b9b19c; line-height: 2; font-size: 16px; margin-bottom: 28px; }
.menu { display: flex; flex-direction: column; gap: 12px; align-items: center; } .menu .btn { width: 240px; }
.foot { margin-top: 26px; color: var(--dim); font-size: 14px; }

/* ---------- 选择道途 / 传承 ---------- */
.panel.select, .panel.meta-panel { margin-top: 30px; } .class-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin: 18px 0; }
.class-card { position: relative; padding: 18px 14px; border-radius: 12px; border: 2px solid color-mix(in srgb, var(--c) 40%, #222); background: linear-gradient(#1c212c, #131720); cursor: pointer; transition: transform .15s, box-shadow .15s; text-align: center; }
.class-card:hover { transform: translateY(-4px); } .class-card.on { border-color: var(--c); box-shadow: 0 0 26px color-mix(in srgb, var(--c) 45%, transparent); background: linear-gradient(color-mix(in srgb, var(--c) 18%, #1c212c), #131720); }
.class-card .cg { width: 74px; height: 74px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; color: #fff; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 75%, #fff), color-mix(in srgb, var(--c) 40%, #000)); border: 3px solid var(--c); text-shadow: 0 2px 6px #000; }
.class-card h3 { margin: 4px 0; font-size: 26px; letter-spacing: 6px; color: var(--c); } .class-card p { margin: 6px 0; font-size: 14px; line-height: 1.6; color: #cfc6b0; } .class-card .tag { color: var(--gold2); font-size: 13px; letter-spacing: 2px; }
.class-card .meta { color: var(--dim); font-size: 12.5px; } .class-card .relic-d { color: #a9c4b6; }
.class-card.locked { opacity: .55; cursor: default; filter: grayscale(.6); padding-bottom: 40px; } .class-card .lock { position: absolute; inset: auto 0 10px; color: #e8a05a; font-size: 13px; }
.asc { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; } .asc b { font-size: 24px; color: var(--gold2); min-width: 24px; } .asc em { font-style: normal; color: var(--dim); font-size: 14px; flex-basis: 100%; }
.meta-panel .dao { font-size: 19px; color: var(--gold2); } .meta-panel .dao b { font-size: 30px; }
.meta-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left; padding: 12px 6px; border-bottom: 1px solid rgba(255, 255, 255, .07); } .meta-row p { margin: 4px 0 0; color: var(--dim); font-size: 14px; } .meta-row .btn { margin: 0; flex: none; min-width: 110px; }
.dots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #333a48; margin-left: 4px; } .dots i.on { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

/* ---------- 地图 ---------- */
.map-screen { padding: 8px 12px 18px; } .map-head { text-align: center; } .map-head h2 { margin: 10px 0 2px; font-size: 28px; letter-spacing: 8px; color: var(--gold2); } .map-head p { margin: 0 0 6px; color: var(--dim); font-size: 14px; }
.map-wrap { position: relative; height: 640px; max-width: 720px; margin: 0 auto; }
.map-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-lines line { stroke: rgba(216, 180, 90, .22); stroke-width: 2; stroke-dasharray: 5 6; vector-effect: non-scaling-stroke; } .map-lines line.on { stroke: rgba(240, 215, 140, .85); stroke-dasharray: none; stroke-width: 3; }
.node { position: absolute; transform: translate(-50%, -50%); width: 54px; height: 54px; border-radius: 50%; border: 2px solid #5a6072; background: radial-gradient(circle at 35% 30%, #343a4b, #191d27); font-size: 23px; display: grid; place-items: center; padding: 0; cursor: default; color: #c9c2ae; box-shadow: 0 3px 10px rgba(0, 0, 0, .5); }
.node.mini { position: static; transform: none; width: 22px; height: 22px; font-size: 12px; margin-right: 5px; display: inline-grid; vertical-align: middle; }
.node.battle { border-color: #8a6f5a; } .node.elite { border-color: #d8513f; color: #ff9a86; background: radial-gradient(circle at 35% 30%, #4a2323, #1e1010); } .node.event { border-color: #9a7ad8; color: #c4aaff; }
.node.shop { border-color: #d8b45a; color: var(--gold2); } .node.rest { border-color: #5db596; color: #8fe0c0; } .node.chest { border-color: #f0c35a; color: #ffe08a; background: radial-gradient(circle at 35% 30%, #4a3c1c, #1e180c); }
.node.boss { width: 78px; height: 78px; font-size: 36px; border-color: #ff5a44; color: #ffb0a0; background: radial-gradient(circle at 35% 30%, #5a2020, #1c0c0c); box-shadow: 0 0 26px rgba(255, 90, 68, .5); }
.node.far { opacity: .45; } .node.done { opacity: .5; filter: grayscale(.7); } .node.cur { box-shadow: 0 0 0 3px var(--gold2), 0 0 18px var(--gold); opacity: 1; filter: none; }
.node.avail { cursor: pointer; animation: pulse 1.4s infinite; box-shadow: 0 0 0 2px var(--gold2), 0 0 18px 4px rgba(240, 215, 140, .55); color: #fff; } .node.avail:hover { transform: translate(-50%, -50%) scale(1.15); }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--gold2), 0 0 26px 8px rgba(240, 215, 140, .7); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; margin-top: 12px; color: var(--dim); font-size: 13px; }

/* ---------- 战斗 ---------- */
.combat { min-height: 100%; height: 100%; display: flex; flex-direction: column; position: relative; }
.field { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: space-between; padding: 6px 3vw 4px; gap: 10px; }
.pzone { width: 24%; min-width: 150px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-bottom: 8px; }
.player, .enemy { display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; transition: transform .2s, opacity .5s, filter .3s; }
.player { width: 160px; } .enemies { flex: 1; display: flex; justify-content: center; align-items: flex-end; gap: 1.6vw; padding-bottom: 8px; }
.combat { --av: clamp(84px, 17vh, 136px); }
.enemy { width: 158px; cursor: default; } .enemy.targetable { cursor: crosshair; } .enemy.targetable .avatar { animation: tgt .8s infinite alternate; }
@keyframes tgt { to { box-shadow: 0 0 0 4px #ffd96a, 0 0 30px #ffd96a; } }
.avatar { position: relative; width: var(--av); height: var(--av); border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--el) 60%, #fff 8%), color-mix(in srgb, var(--el) 38%, #080a0e) 72%); border: 3px solid color-mix(in srgb, var(--el) 70%, #fff); box-shadow: 0 0 22px color-mix(in srgb, var(--el) 55%, transparent), inset 0 0 24px rgba(0, 0, 0, .55); }
.avatar span { font-size: calc(var(--av) * .54); color: #fff; text-shadow: 0 2px 6px #000, 0 0 14px var(--el); line-height: 1; }
.enemy.elite .avatar { width: calc(var(--av) * 1.16); height: calc(var(--av) * 1.16); border-width: 4px; }
.enemy.boss .avatar { width: calc(var(--av) * 1.5); height: calc(var(--av) * 1.5); border-width: 5px; } .enemy.boss { width: 200px; }
.avatar .elb { position: absolute; left: -6px; top: -4px; width: 26px; height: 26px; border-radius: 50%; background: var(--el); color: #111; display: grid; place-items: center; font-size: 14px; font-style: normal; border: 2px solid rgba(255, 255, 255, .7); cursor: help; }
.blk { position: absolute; right: -10px; bottom: -6px; min-width: 34px; height: 34px; padding: 0 5px; border-radius: 7px 7px 16px 16px; display: grid; place-items: center; background: linear-gradient(#63b0ee, #2b5fa8); border: 2px solid #d5eaff; color: #fff; font-weight: 700; font-size: 17px; text-shadow: 0 1px 2px #000; }
.ename { font-size: 17px; letter-spacing: 2px; } .ename small { margin-left: 6px; color: #ff9a86; font-size: 12px; }
.hpbar { position: relative; width: 100%; height: 16px; background: #2a1414; border: 1px solid #000; border-radius: 9px; overflow: hidden; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#e85d49, #a12a1c); transition: width .4s; } .player .hpbar i { background: linear-gradient(#66d6ab, #2c8a6a); }
.hpbar span { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 16px; color: #fff; text-shadow: 0 1px 2px #000; }
.sts { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; min-height: 26px; }
.st { position: relative; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 14px; background: #202533; border: 1.5px solid; cursor: help; } .st.good { border-color: #5db596; color: #b6f2d8; } .st.bad { border-color: #b070e0; color: #e2c4ff; }
.st i { position: absolute; right: -5px; bottom: -6px; font-style: normal; font-size: 11px; background: #000; border-radius: 8px; padding: 0 4px; color: #fff; line-height: 15px; }
.intent-row { min-height: 34px; display: flex; align-items: flex-end; }
.intent { display: flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, .62); border: 1px solid rgba(255, 255, 255, .16); border-radius: 18px; padding: 3px 9px 3px 4px; cursor: help; font-size: 17px; } .intent b { color: #ffcfc4; font-size: 19px; } .intent em { font-style: normal; font-size: 12px; color: var(--dim); margin-left: 3px; }
.ii { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: #fff; text-shadow: 0 1px 2px #000; } .ii.atk { background: #b43a2c; } .ii.def { background: #2d64ac; } .ii.debuff { background: #7a44b0; } .ii.buff, .ii.charge { background: #b98a25; } .ii.summon { background: #2f8f6d; } .ii.stun { background: #666; }
.enemy.dead { opacity: .14; filter: grayscale(1); pointer-events: none; transform: scale(.85); } .enemy.dead .intent-row, .enemy.dead .sts { visibility: hidden; }
.lunge { transform: translateX(-70px) scale(1.06) !important; } .hit .avatar { animation: hitflash .35s; } @keyframes hitflash { 30% { filter: brightness(2.6) saturate(0) ; transform: translateX(6px);} 60% { transform: translateX(-6px);} }
body.shake #app { animation: shake .3s; } @keyframes shake { 25% { transform: translate(-5px, 2px); } 50% { transform: translate(5px, -2px); } 75% { transform: translate(-3px, 0); } }
.chain { display: flex; align-items: center; gap: 2px; padding: 4px 8px; background: rgba(0, 0, 0, .4); border-radius: 20px; border: 1px solid rgba(255, 255, 255, .1); cursor: help; }
.chain i { color: var(--dim); font-style: normal; font-size: 12px; } .cel { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; color: var(--el); border: 1.5px solid color-mix(in srgb, var(--el) 40%, #000); opacity: .55; transition: all .2s; }
.cel.last { background: var(--el); color: #111; opacity: 1; transform: scale(1.1); } .cel.next { opacity: 1; box-shadow: 0 0 10px var(--el); animation: nextp 1s infinite alternate; } @keyframes nextp { to { transform: scale(1.18); } }
.hint { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, .75); border: 1px solid var(--gold); padding: 6px 16px; border-radius: 18px; z-index: 12; font-size: 15px; } .hint a { color: var(--gold2); cursor: pointer; text-decoration: underline; margin-left: 8px; }

.hud { display: grid; grid-template-columns: 138px 1fr 150px; align-items: end; height: calc(var(--ch) + 46px); padding: 0 8px 8px; position: relative; z-index: 8; }
.side { display: flex; flex-direction: column; gap: 8px; align-items: center; padding-bottom: 6px; }
.energy { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; align-content: center; background: radial-gradient(circle at 35% 30%, #74bcf5, #26559b 70%); border: 3px solid #d5eaff; box-shadow: 0 0 22px rgba(90, 169, 230, .6); cursor: help; }
.energy b { font-size: 34px; line-height: 1; color: #fff; text-shadow: 0 2px 4px #000; } .energy small { color: #cfe6ff; font-size: 13px; }
.pile { background: #202533; border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 14px; } .pile i { font-style: normal; color: var(--gold2); margin-left: 6px; } .pile:hover { background: #2c3345; }
.btn.end { padding: 12px 18px; font-size: 18px; background: linear-gradient(#cf5443, #8a2a1d); border-color: #ffb0a0; color: #fff; } .btn.end.wait { background: linear-gradient(#3a3f4d, #262a35); border-color: var(--line); }
.hand { display: flex; justify-content: center; align-items: flex-end; height: 100%; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }

/* ---------- 卡牌 ---------- */
.card { position: relative; width: var(--cw); height: var(--ch); flex: none; border-radius: 10px; padding: 6px 7px 7px; background: linear-gradient(160deg, #2b2f3b, #171a23); border: 2px solid #4a4f5e; box-shadow: 0 6px 14px rgba(0, 0, 0, .55); display: flex; flex-direction: column; user-select: none; cursor: pointer; font-size: 12px; }
.card.atk { border-color: #b04a3d; background: linear-gradient(160deg, #3d2525, #1a1516); } .card.skl { border-color: #3f86b0; background: linear-gradient(160deg, #1f3140, #12181e); } .card.pow { border-color: #9060c8; background: linear-gradient(160deg, #31243f, #171220); }
.card.junk { border-color: #666; background: #1d1d1f; filter: grayscale(.6); } .card.rare { box-shadow: 0 6px 14px rgba(0, 0, 0, .55), 0 0 14px rgba(240, 195, 90, .35); } .card.rare .cname { color: #ffd77a; } .card.uncommon .cname { color: #8fd0ff; }
.hand .card { margin: 0 var(--m, 2px); transform: translateY(var(--y, 0)) rotate(var(--r, 0)); transform-origin: 50% 130%; transition: transform .16s, box-shadow .16s; animation: deal .4s both; animation-delay: calc(var(--i, 0) * 45ms); }
.hand .card:not(.fresh) { animation: none; }
@keyframes deal { from { transform: translate(-60vw, 30px) scale(.5) rotate(-30deg); opacity: 0; } }
.hand .card:hover, .hand .card.sel { transform: translateY(-58px) scale(1.22) rotate(0); z-index: 30; box-shadow: 0 16px 30px rgba(0, 0, 0, .7); }

      const p = this.player;
      if (e.hpLoss) { this.hurt(p, e.hpLoss, null, {}); if (this.result) return; }
      const targets = e.aoe ? this.alive() : target ? [target] : [];
      const hasDmg = e.dmg != null || e.dmgBlock || e.dmgPoison;
      if (hasDmg) {
        const hits = e.x ? X : e.hits || 1;
        let mult = 1;
        if (v.type === 'atk' && this.rs.lbReady) { mult = 2; this.rs.lbReady = 0; }
        for (let h = 0; h < hits; h++) {
          for (const t of targets) {
            if (t.dead || this.phase === 'over') continue;
            let base = e.dmg || 0;
            if (e.dmgBlock) base = Math.floor(p.block * e.dmgBlock);
            if (e.dmgPoison) base = (t.st.poison || 0) * e.dmgPoison;
            const d = this.calcDamage(p, t, base, { el: v.el, sheng, strMult: e.strMult, mult });
            const res = this.hurt(t, d, p, { attack: true });
            if (e.lifesteal && res.loss > 0) this.heal(p, res.loss);
            if (p.st.envenom && res.loss > 0 && !t.dead) this.addStatus(t, 'poison', p.st.envenom);
          }
        }
      }
      if (this.phase === 'over') return;
      if (e.block) this.gainBlock(p, e.block, { sheng });
      if (e.heal) this.heal(p, e.heal);
      if (e.draw) this.drawCards(e.draw);
      if (e.energy) this.energy += e.energy;
      if (e.apply) targets.forEach((t) => { if (!t.dead) for (const k in e.apply) this.addStatus(t, k, e.apply[k]); });
      if (e.applyAll) this.alive().forEach((t) => { for (const k in e.applyAll) this.addStatus(t, k, e.applyAll[k]); });
      if (e.self) for (const k in e.self) this.addStatus(p, k, e.self[k]);
      if (e.fx && FX[e.fx]) FX[e.fx](this, e, target, X);
    }
    usePotion(slot, target) {
      const id = this.run.potions[slot];
      if (!id || this.phase !== 'player') return { ok: false };
      const pd = POTIONS[id];
      if (pd.target) {
        if (!target || target.dead) { const al = this.alive(); if (al.length === 1) target = al[0]; else return { ok: false, reason: '需要目标' }; }
      }
      this.run.potions[slot] = null;
      pd.use(this, target);
      this.checkWin();
      return { ok: true };
    }
  }

  /* ================= 存档存储 ================= */
  const memStore = {};
  const store = {
    get(k) { try { const v = G.localStorage && G.localStorage.getItem(k); return v == null ? memStore[k] || null : v; } catch (e) { return memStore[k] || null; } },
    set(k, v) { memStore[k] = v; try { G.localStorage && G.localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    del(k) { delete memStore[k]; try { G.localStorage && G.localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };
  const META_KEY = 'xianxia.meta.v1', RUN_KEY = 'xianxia.run.v1';

  const Meta = {
    fresh() { return { dao: 0, lv: {}, runs: 0, wins: 0, maxAsc: 0, bestRealm: 0 }; },
    load() { try { const m = JSON.parse(store.get(META_KEY)); if (m && m.lv) return Object.assign(Meta.fresh(), m); } catch (e) { /* ignore */ } return Meta.fresh(); },
    save(m) { store.set(META_KEY, JSON.stringify(m)); },
    level(m, id) { return m.lv[id] || 0; },
    classUnlocked(m, cls) { return cls === 'sword' || cls === 'body' || !!m.lv[cls]; },
    canBuy(m, def) { const l = Meta.level(m, def.id); return l < def.max && m.dao >= def.cost(l); },
    buy(m, id) {
      const def = META.find((x) => x.id === id), l = Meta.level(m, id);
      if (!def || !Meta.canBuy(m, def)) return false;
      m.dao -= def.cost(l); m.lv[id] = l + 1; Meta.save(m); return true;
    },
    /** 一局结束时结算，返回获得的道果 */
    finish(m, run) {
      const gain = run.daoGain();
      m.dao += gain; m.runs++;
      if (run.outcome === 'win') { m.wins++; m.maxAsc = Math.min(5, Math.max(m.maxAsc, run.asc + 1)); }
      m.bestRealm = Math.max(m.bestRealm, run.realm + (run.outcome === 'win' ? 1 : 0));
      Meta.save(m);
      return gain;
    },
  };

  /* ================= 一局游戏 ================= */
  const MAP_W = 5, MAP_ROWS = 6; // 行 0..5 为普通节点，第 6 行为 Boss
  const CARD_PRICE = { common: 50, uncommon: 80, rare: 150 };
  const RELIC_PRICE = { common: 150, uncommon: 250, rare: 300 };
  const POTION_PRICE = { common: 50, uncommon: 75, rare: 110 };

  class Run {
    static create(opts) {
      const r = new Run();
      const meta = opts.meta || Meta.fresh();
      const cls = CLASSES[opts.cls];
      r.v = 1; r.seed = (opts.seed == null ? (Math.random() * 4294967296) >>> 0 : opts.seed >>> 0);
      r.rng = new RNG(r.seed);
      r.cls = opts.cls; r.asc = opts.asc || 0;
      r.maxHp = cls.hp + 4 * Meta.level(meta, 'hp'); r.hp = r.maxHp;
      r.gold = 99 + 25 * Meta.level(meta, 'gold');
      r.uidc = 1; r.deck = []; r.relics = []; r.potions = [null, null, null];
      r.mods = { extraChoice: Meta.level(meta, 'choice') > 0 };
      r.flags = {}; r.seenEvents = []; r.removals = 0;
      r.stats = { fights: 0, elites: 0, bosses: 0, floors: 0 };
      cls.deck.forEach((id) => r.addCard(id));
      r.relics.push(cls.relic);
      if (Meta.level(meta, 'insight')) { const c = r.rng.pick(r.deck.filter((x) => canUpgrade(x) && CARDS[x.id].rarity === 'starter' && x.id !== 'defend')); if (c) c.up = true; }
      if (Meta.level(meta, 'potion')) r.gainRandomPotion();
      if (Meta.level(meta, 'relic')) r.gainRandomRelic('common');
      r.realm = 0; r.queue = []; r.phase = 'map'; r.outcome = null;
      r.newRealm();
      return r;
    }
    toJSON() {
      const o = {};
      ['v', 'seed', 'cls', 'asc', 'hp', 'maxHp', 'gold', 'uidc', 'deck', 'relics', 'potions', 'mods', 'flags', 'seenEvents', 'removals', 'stats', 'realm', 'map', 'cur', 'path', 'fightsInRealm'].forEach((k) => (o[k] = this[k]));
      o.rngState = this.rng.s;
      return o;
    }
    static fromJSON(o) {
      const r = new Run();
      Object.assign(r, o);
      r.rng = new RNG(1); r.rng.s = o.rngState >>> 0;
      r.queue = []; r.phase = 'map'; r.outcome = null; r.battle = null;
      return r;
    }

    /* ---- 基础操作 ---- */
    addCard(id, up) { const c = { u: this.uidc++, id, up: !!up }; this.deck.push(c); return c; }
    removeCard(uid) { const i = this.deck.findIndex((c) => c.u === uid); if (i >= 0) this.deck.splice(i, 1); }
    upgradeCard(uid) { const c = this.deck.find((x) => x.u === uid); if (c && canUpgrade(c)) c.up = true; }
    upgradeRandom(n) {
      const pool = this.rng.shuffle(this.deck.filter(canUpgrade)).slice(0, n);
      pool.forEach((c) => (c.up = true));
      return pool.length;
    }
    heal(n) { this.hp = Math.min(this.maxHp, this.hp + n); }
    loseHp(n) { this.hp = Math.max(1, this.hp - n); }
    gainMaxHp(n) { this.maxHp += n; this.hp += n; }
    gainGold(n) { this.gold += n; }
    hasRelic(id) { return this.relics.includes(id); }
    sumRelic(key) { return this.relics.reduce((s, id) => s + (RELICS[id][key] || 0), 0); }
    addRelic(id) {
      this.relics.push(id);
      const r = RELICS[id];
      if (r.onPickup) r.onPickup(this);
    }
    addPotionSlots(n) { for (let i = 0; i < n; i++) this.potions.push(null); }
    canGainPotion() { return !this.relics.some((id) => RELICS[id].noPotion) && this.potions.includes(null); }
    addPotion(id) {
      if (!this.canGainPotion()) return false;
      this.potions[this.potions.indexOf(null)] = id; return true;
    }
    gainRandomPotion() {
      if (!this.canGainPotion()) return false;
      const rar = this.rng.weighted({ common: 65, uncommon: 25, rare: 10 });
      const ids = Object.keys(POTIONS).filter((k) => POTIONS[k].r === rar);
      return this.addPotion(this.rng.pick(ids));
    }
    rollRelic(weights) {
      const owned = new Set(this.relics);
      for (let t = 0; t < 8; t++) {
        const rar = this.rng.weighted(weights || { common: 50, uncommon: 33, rare: 17 });
        const ids = Object.keys(RELICS).filter((k) => RELICS[k].r === rar && !owned.has(k));
        if (ids.length) return this.rng.pick(ids);
      }
      return null;
    }
    gainRandomRelic(rar) {
      const id = this.rollRelic(rar ? { [rar]: 1 } : null);
      if (id) this.addRelic(id);
      return id;
    }
    rollBossRelics(n) {
      const owned = new Set(this.relics);
      return this.rng.shuffle(Object.keys(RELICS).filter((k) => RELICS[k].r === 'boss' && !owned.has(k))).slice(0, n);
    }
    rollCards(n, kind) {
      const wmap = {
        normal: { common: 60, uncommon: 37, rare: 3 }, elite: { common: 50, uncommon: 40, rare: 10 },
        shop: { common: 52, uncommon: 36, rare: 12 }, rare: { rare: 1 }, boss: { rare: 1 },
      };
      const w = Object.assign({}, wmap[kind] || wmap.normal);
      if (w.rare && w.common) w.rare += this.realm;
      const out = []; let guard = 0;
      while (out.length < n && guard++ < 300) {
        const rar = this.rng.weighted(w);
        const cls = this.rng.chance(0.25) ? 'neutral' : this.cls;
        const pool = Object.keys(CARDS).filter((k) => CARDS[k].rarity === rar && CARDS[k].cls === cls);
        if (!pool.length) continue;
        const id = this.rng.pick(pool);
        if (!out.includes(id)) out.push(id);
      }
      return out;
    }

    /* ---- 地图 ---- */
    newRealm() {
      this.map = this.genMap(); this.cur = null; this.node = null; this.fightsInRealm = 0; this.path = [];
    }
    genMap() {
      const rng = this.rng, W = MAP_W, R = MAP_ROWS;
      const exist = Array.from({ length: R }, () => Array(W).fill(false));
      const edges = Array.from({ length: R }, () => Array.from({ length: W }, () => new Set()));
      const cols = rng.shuffle([0, 1, 2, 3, 4]);
      const starts = cols.slice(0, rng.range(3, 4));
      while (starts.length < 4) starts.push(rng.pick(starts));
      starts.forEach((s) => {
        let c = s;
        for (let r = 0; r < R; r++) {
          exist[r][c] = true;
          if (r === R - 1) break;
          const opts = rng.shuffle([c - 1, c, c + 1].filter((n) => n >= 0 && n < W));
          let n = opts.find((x) => x === c || !edges[r][x].has(c));
          if (n == null) n = c;
          edges[r][c].add(n); c = n;
        }
      });
      const rows = [];
      for (let r = 0; r < R; r++) {
        rows.push(Array.from({ length: W }, (_, c) => (exist[r][c]
          ? { r, c, type: 'battle', next: r === R - 1 ? [2] : Array.from(edges[r][c]).sort(), jx: (rng.next() - 0.5) * 0.5, jy: (rng.next() - 0.5) * 0.4 }
          : null)));
      }
      rows.push([null, null, { r: R, c: 2, type: 'boss', next: [], jx: 0, jy: 0 }, null, null]);
      // 类型分配
      const special = new Set(['shop', 'rest', 'elite']);
      for (let r = 0; r < R; r++) {
        for (let c = 0; c < W; c++) {
          const node = rows[r][c]; if (!node) continue;
          if (r === 0) { node.type = 'battle'; continue; }
          if (r === 3) { node.type = 'chest'; continue; }
          if (r === R - 1) { node.type = 'rest'; continue; }
          const parents = [];
          for (let pc = 0; pc < W; pc++) if (rows[r - 1][pc] && rows[r - 1][pc].next.includes(c)) parents.push(rows[r - 1][pc].type);
          const w = { battle: 46, event: 22, shop: r >= 1 ? 8 : 0, rest: r >= 1 && r <= 2 ? 12 : 0, elite: r >= 2 ? 12 : 0 };
          for (let t = 0; t < 10; t++) {
            const type = rng.weighted(w);
            if (special.has(type) && parents.includes(type)) continue;
            node.type = type; break;
          }
        }
      }
      const all = rows.flat().filter(Boolean);
      const convert = (type, rowsOk) => {
        if (all.some((n) => n.type === type)) return;
        const cand = all.filter((n) => rowsOk.includes(n.r) && (n.type === 'battle' || n.type === 'event'));
        const n = rng.pick(cand); if (n) n.type = type;
      };
      convert('shop', [1, 2, 4]); convert('elite', [2, 4]);
      return rows;
    }
    availableNodes() {
      if (this.phase !== 'map') return [];
      if (!this.cur) return this.map[0].filter(Boolean);
      return this.map[this.cur.r].find((n) => n && n.c === this.cur.c).next.map((c) => this.map[this.cur.r + 1][c]);
    }
    enterNode(r, c) {
      const node = this.availableNodes().find((n) => n.r === r && n.c === c);
      if (!node) return false;
      this.cur = { r, c }; this.node = node; this.path.push(r + '_' + c);
      switch (node.type) {
        case 'battle': this.startBattle(this.pickEncounter('normal'), 'normal'); break;
        case 'elite': this.startBattle(this.pickEncounter('elite'), 'elite'); break;
        case 'boss': this.startBattle(this.pickEncounter('boss'), 'boss'); break;
        case 'event': this.startEvent(); break;
        case 'shop': this.shop = this.genShop(); this.phase = 'shop'; break;
        case 'rest': this.phase = 'rest'; break;
        case 'chest': this.phase = 'chest'; this.chest = { relic: this.rollRelic(), gold: this.rng.range(25, 50), opened: false }; break;
      }
      return true;
    }
    pickEncounter(kind) {
      const enc = ENCOUNTERS[this.realm];
      if (kind === 'boss') return enc.boss.slice();
      if (kind === 'elite') return this.rng.pick(enc.elite).slice();
      return this.rng.pick(this.fightsInRealm < 2 ? enc.easy : enc.hard).slice();
    }
    startBattle(ids, kind) {
      this.battle = new Battle(this, ids, kind);
      this.phase = 'battle';
      this.battle.start();
    }
    finishBattle() {
      const b = this.battle;
      if (b.result === 'lose') { this.killedBy = b.enemies.map((e) => e.id).join('+'); return this.lose(); }
      const kind = b.kind;
      this.stats.fights++; this.fightsInRealm++;
      if (kind === 'elite') this.stats.elites++;
      if (kind === 'boss') this.stats.bosses++;
      this.battle = null;
      this.queue = [{ t: 'reward', reward: this.makeReward(kind) }];
      if (kind === 'boss' && this.realm < REALMS.length - 1) this.queue.push({ t: 'breakthrough', options: this.rng.shuffle(BREAKTHROUGH.slice()).slice(0, 3).map((o) => o.id) });
      this.advance();
    }
    makeReward(kind) {
      const rg = { normal: [10, 20], elite: [25, 35], boss: [60, 80] }[kind];
      const gold = Math.round(this.rng.range(rg[0], rg[1]) * (1 + this.relics.reduce((s, id) => s + ((RELICS[id].goldMult || 1) - 1), 0)));
      this.gold += gold;
      const n = 3 + (this.mods.extraChoice ? 1 : 0);
      const rw = { gold, cards: this.rollCards(n, kind), cardsDone: false, potion: null, potionTaken: false, relics: [], relicChoose: false, relicTaken: false };
      if (this.rng.chance({ normal: 0.35, elite: 0.5, boss: 0 }[kind]) && this.canGainPotion()) {
        const rar = this.rng.weighted({ common: 65, uncommon: 25, rare: 10 });
        rw.potion = this.rng.pick(Object.keys(POTIONS).filter((k) => POTIONS[k].r === rar));
      }
      if (kind === 'elite') { const id = this.rollRelic(); if (id) rw.relics = [id]; }
      if (kind === 'boss') { rw.relics = this.rollBossRelics(3); rw.relicChoose = true; }
      return rw;
    }
    rewardPickCard(i) { const rw = this.reward; if (rw.cardsDone) return; this.addCard(rw.cards[i]); rw.cardsDone = true; }
    rewardSkipCards() { this.reward.cardsDone = true; }
    rewardTakePotion() { const rw = this.reward; if (rw.potion && !rw.potionTaken && this.addPotion(rw.potion)) rw.potionTaken = true; }
    rewardTakeRelic(i) {
      const rw = this.reward;
      if (rw.relicTaken || !rw.relics[i]) return;
      this.addRelic(rw.relics[i]); rw.relicTaken = true;
    }
    rewardLeave() { this.reward = null; this.advance(); }

    /* ---- 步骤队列 ---- */
    advance() {
      const s = this.queue.shift();
      if (!s) return this.completeNode();
      switch (s.t) {
        case 'reward': this.phase = 'reward'; this.reward = s.reward; break;
        case 'pick': this.phase = 'pick'; this.pickInfo = s; break;
        case 'cards': this.phase = 'cards'; this.offer = s; break;
        case 'breakthrough': this.phase = 'breakthrough'; this.btOptions = s.options; break;
        case 'battle': this.startBattle(this.pickEncounter('elite'), 'elite'); break;
      }
    }
    completeNode() {
      const node = this.node;
      this.stats.floors++;
      if (node && node.type === 'boss') {
        if (this.realm >= REALMS.length - 1) return this.win();
        this.realm++; this.hp = this.maxHp; this.newRealm();
      }
      this.phase = 'map';
    }
    win() { this.phase = 'over'; this.outcome = 'win'; }
    lose() { this.phase = 'over'; this.outcome = 'dead'; this.battle = null; }
    daoGain() {
      const s = this.stats;
      const base = s.floors + s.fights * 2 + s.elites * 4 + s.bosses * 15 + (this.outcome === 'win' ? 60 : 0);
      return Math.round(base * (1 + 0.2 * this.asc));
    }

    /* ---- 选牌 / 三选一 / 突破 ---- */
    pickEligible() { return this.pickInfo.mode === 'upgrade' ? this.deck.filter(canUpgrade) : this.deck.slice(); }
    pickChoose(uid) {
      const info = this.pickInfo;
      if (info.mode === 'upgrade') this.upgradeCard(uid); else this.removeCard(uid);
      if (info.cost) { this.gold -= info.cost; this.shop.removed = true; this.removals++; }
      this.pickInfo = null;
      if (info.back) this.phase = info.back; else this.advance();
    }
    pickSkip() { const info = this.pickInfo; this.pickInfo = null; if (info.back) this.phase = info.back; else this.advance(); }
    offerChoose(i) { this.addCard(this.offer.ids[i]); this.offer = null; this.advance(); }
    offerSkip() { this.offer = null; this.advance(); }
    breakthroughChoose(id) {
      const o = BREAKTHROUGH.find((x) => x.id === id);
      const res = o.do(this);
      this.btOptions = null;
      if (res && res.t) this.pushStep(res, true);
      this.advance();
    }
    pushStep(then, front) {
      let step = null;
      if (then.t === 'pick') step = { t: 'pick', mode: then.mode };
      else if (then.t === 'cards') step = { t: 'cards', ids: this.rollCards(then.n || 3, then.rarity === 'rare' ? 'rare' : 'shop') };
      else if (then.t === 'battle') step = { t: 'battle' };
      if (!step) return;
      if (front) this.queue.unshift(step); else this.queue.push(step);
    }

    /* ---- 奇遇 ---- */
    startEvent() {
      let pool = EVENTS.filter((e) => !this.seenEvents.includes(e.id));
      if (!pool.length) { this.seenEvents = []; pool = EVENTS; }
      const def = this.rng.pick(pool);
      this.seenEvents.push(def.id);
      this.event = { def, title: def.title, text: def.text, choices: def.choices(this), outcome: null };
      this.phase = 'event';
    }
    eventChoose(i) {
      const ch = this.event.choices[i];
      if (!ch || (ch.can && !ch.can())) return;
      this.event.outcome = ch.do();
    }
    eventContinue() {
      const then = this.event.outcome && this.event.outcome.then;
      this.event = null;
      if (then) this.pushStep(then, false);
      this.advance();
    }

    /* ---- 洞府 ---- */
    canRestHeal() { return !this.hasRelicKey('noRest'); }
    hasRelicKey(k) { return this.relics.some((id) => RELICS[id][k]); }
    restHeal() { if (!this.canRestHeal()) return; this.heal(Math.floor(this.maxHp * 0.3)); this.advance(); }
    restUpgrade() { this.queue.unshift({ t: 'pick', mode: 'upgrade' }); this.advance(); }

    /* ---- 宝箱 ---- */
    openChest() {
      const c = this.chest; if (c.opened) return;
      c.opened = true; this.gainGold(c.gold);
      if (c.relic) this.addRelic(c.relic);
    }
    chestLeave() { this.chest = null; this.advance(); }

    /* ---- 坊市 ---- */
    genShop() {
      const price = (base) => Math.round((base * this.rng.range(90, 110)) / 100 / 5) * 5;
      const cards = this.rollCards(7, 'shop').map((id) => ({ id, price: price(CARD_PRICE[CARDS[id].rarity] * (CARDS[id].cls === 'neutral' ? 1.15 : 1)), sold: false }));
      cards[this.rng.int(cards.length)].sale = true;
      cards.forEach((c) => { if (c.sale) c.price = Math.round(c.price / 2 / 5) * 5; });
      const relics = [];
      for (let i = 0; i < 3; i++) {
        const id = this.rollRelic();
        if (id && !relics.some((r) => r.id === id)) relics.push({ id, price: price(RELIC_PRICE[RELICS[id].r]), sold: false });
      }
      const potions = [];
      for (let i = 0; i < 3; i++) {
        const rar = this.rng.weighted({ common: 60, uncommon: 30, rare: 10 });
        const id = this.rng.pick(Object.keys(POTIONS).filter((k) => POTIONS[k].r === rar));
        potions.push({ id, price: price(POTION_PRICE[rar]), sold: false });
      }
      return { cards, relics, potions, removeCost: 75 + 25 * this.removals, removed: false };
    }
    shopBuy(kind, i) {
      const item = this.shop[kind][i];
      if (!item || item.sold || this.gold < item.price) return false;
      if (kind === 'potions' && !this.canGainPotion()) return false;
      this.gold -= item.price; item.sold = true;
      if (kind === 'cards') this.addCard(item.id);
      else if (kind === 'relics') this.addRelic(item.id);
      else this.addPotion(item.id);
      return true;
    }
    shopRemove() {
      const s = this.shop;
      if (s.removed || this.gold < s.removeCost || !this.deck.length) return false;
      this.pickInfo = { t: 'pick', mode: 'remove', back: 'shop', cost: s.removeCost }; this.phase = 'pick';
      return true;
    }
    shopLeave() { this.shop = null; this.advance(); }

    /* ---- 药水（地图上） ---- */
    discardPotion(i) { this.potions[i] = null; }
  }

  Object.assign(XX, { RNG, Battle, Run, Meta, store, FX, view, cardText, canUpgrade, mergeEff, MAP_W, MAP_ROWS, RUN_KEY, META_KEY });

  XX.saveRun = (run) => { if (run && run.phase === 'map') store.set(RUN_KEY, JSON.stringify(run)); };
  XX.loadRun = () => { try { const o = JSON.parse(store.get(RUN_KEY)); if (o && o.v === 1 && o.map) return Run.fromJSON(o); } catch (e) { /* ignore */ } return null; };
  XX.clearRun = () => store.del(RUN_KEY);
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 问道长生 - 界面层：DOM 渲染、交互、动效、音效 */
(function (G) {

  const app = D.getElementById('app'), tipEl = D.getElementById('tip'), fxLayer = D.getElementById('fxlayer');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const INTENT_G = { atk: '攻', def: '守', debuff: '咒', buff: '强', summon: '召', stun: '晕', charge: '蓄' };
  const INTENT_N = { atk: '攻击', def: '防御', debuff: '施咒', buff: '强化', summon: '召唤', stun: '眩晕', charge: '蓄力' };
  const CYCLE = ['木', '火', '土', '金', '水'];

  /* ================= 音效（WebAudio 合成） ================= */
  let actx = null;
  function sfx(kind) {
    if (ui.muted) return;
    try {
      actx = actx || new (G.AudioContext || G.webkitAudioContext)();
      const t0 = actx.currentTime;
      const tone = (f, dur, type, vol, slide, delay) => {
        const o = actx.createOscillator(), g = actx.createGain(), t = t0 + (delay || 0);
        o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
        g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
      };
      switch (kind) {
        case 'card': tone(520, 0.07, 'triangle', 0.05, 380); break;
        case 'hit': tone(180, 0.16, 'sawtooth', 0.09, 60); break;
        case 'hurt': tone(120, 0.24, 'square', 0.09, 45); break;
        case 'block': tone(700, 0.09, 'square', 0.05, 900); break;
        case 'heal': tone(440, 0.12, 'sine', 0.06, 660); tone(660, 0.16, 'sine', 0.05, 880, 0.08); break;
        case 'sheng': tone(660, 0.1, 'sine', 0.06, 990); tone(990, 0.16, 'sine', 0.05, 1320, 0.07); break;
        case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, 'triangle', 0.07, 0, i * 0.11)); break;
        case 'lose': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.4, 'sine', 0.08, 0, i * 0.18)); break;
        case 'ui': tone(600, 0.05, 'sine', 0.04, 500); break;
        case 'buy': tone(880, 0.08, 'triangle', 0.06); tone(1175, 0.1, 'triangle', 0.05, 0, 0.06); break;
      }
    } catch (e) { /* 音频不可用则忽略 */ }
  }

  /* ================= 小部件 ================= */
  const elColor = (el) => (el && ELEMENTS[el] ? ELEMENTS[el].color : '#8a8f9a');
  function statusHtml(ent) {
    return Object.keys(ent.st).filter((k) => STATUS[k] && ent.st[k]).map((k) => {
      const S = STATUS[k], n = ent.st[k];
      return `<span class="st ${S.good ? 'good' : 'bad'}" ${tipAttr(S.n + ' ' + n, S.d.replace(/N/g, n))}>${S.g}<i>${n}</i></span>`;
    }).join('');
  }
  function hpBar(ent) {
    const pct = Math.max(0, Math.min(100, (ent.hp / ent.maxHp) * 100));
    return `<div class="hpbar"><i style="width:${pct}%"></i><span>${Math.max(0, ent.hp)} / ${ent.maxHp}</span></div>`;
  }
  function relicHtml(id, extra) {
    const r = RELICS[id];
    return `<span class="relic r-${r.r}" ${tipAttr(r.n, r.d)} ${extra || ''}>${r.g}</span>`;
  }
  function potionHtml(id, slot, clickable) {
    if (!id) return `<span class="potion empty" ${tipAttr('空丹药栏', '可以携带丹药，战斗中使用。')}></span>`;
    const p = POTIONS[id];
    return `<span class="potion p-${p.r}" ${clickable ? `data-act="potion" data-slot="${slot}"` : ''} ${tipAttr(p.n, p.d)}>${p.g}</span>`;
  }
  function cardHtml(c, o) {
    o = o || {};
    const v = view(c.id, c.up), d = CARDS[c.id], b = o.b;
    const junk = d.rarity === 'status' || d.rarity === 'curse';
    let cost = o.hand && b ? b.cardCost(c) : (v.x ? 'X' : v.cost);
    const cls = ['card', v.type, d.rarity];
    if (junk) cls.push('junk');
    if (o.dim) cls.push('dim');
    if (o.sheng) cls.push('sheng');
    if (o.sel) cls.push('sel');
    if (v.upgraded) cls.push('upg');
    if (o.fresh) cls.push('fresh');
    if (o.small) cls.push('small');
    const costCls = cost !== 'X' && cost < v.cost ? 'cost less' : 'cost';
    return `<div class="${cls.join(' ')}" ${o.attrs || ''} style="--el:${elColor(v.el)};${o.style || ''}">
      <div class="${costCls}">${junk ? '·' : cost}</div>${v.el ? `<div class="elb">${v.el}</div>` : ''}
      <div class="cname">${v.name}</div>
      <div class="art"><span>${d.g || d.name[0]}</span></div>
      <div class="ctype">${TYPE_N[v.type]} · ${RAR_N[d.rarity]}</div>
      <div class="cdesc"><p>${cardText(v, o.hand ? b : null)}</p></div>
      ${o.tag ? `<div class="ctag">${o.tag}</div>` : ''}
    </div>`;
  }
  const chainHtml = (b) => {
    const nextEl = b.lastEl ? ELEMENTS[b.lastEl].gen : '';
    const all = b.player.st.nextSheng > 0;
    return `<div class="chain" ${tipAttr('五行流转', '木生火，火生土，土生金，金生水，水生木。打出的牌若被上一张牌的五行所生，即触发「相生」，伤害与护体大幅提升。')}>` +
      CYCLE.map((e, i) => `<span class="cel ${b.lastEl === e ? 'last' : ''} ${nextEl === e || all ? 'next' : ''}" style="--el:${elColor(e)}">${e}</span>${i < 4 ? '<i>›</i>' : ''}`).join('') + '</div>';
  };
  function moveDesc(b, e, m) {
    const p = [];
    if (m.dmg) p.push(`攻击 ${b.calcDamage(e, b.player, m.dmg)} 点${(m.hits || 1) > 1 ? '×' + m.hits : ''}`);
    if (m.block) p.push(`获得 ${m.block} 点护体`);
    if (m.heal) p.push(`回复 ${m.heal} 点气血`);
    if (m.apply) p.push('使你获得 ' + Object.keys(m.apply).map((k) => `${m.apply[k]}层${STATUS[k].n}`).join('、'));
    if (m.self) p.push('自身获得 ' + Object.keys(m.self).map((k) => `${m.self[k]}层${STATUS[k].n}`).join('、'));
    if (m.cards) p.push('向你的牌堆塞入 ' + m.cards.map((c) => `${c.n}张「${CARDS[c.id].name}」`).join('、'));
    if (m.summon) p.push('召唤援军');
    return p.join('；') || '蓄势待发';
  }
  function intentHtml(b, e) {
    if (e.dead) return '';

    return `<div class="intent" ${tip}>${it.icons.map((k) => `<span class="ii ${k}">${INTENT_G[k]}</span>`).join('')}${dmg}<em>${it.name}</em></div>`;
  }
  function enemyHtml(e, b) {

    return `<div class="enemy ${e.tier} ${e.dead ? 'dead' : ''} ${target ? 'targetable' : ''}" data-uid="${e.uid}" data-act="enemy">
      <div class="intent-row">${intentHtml(b, e)}</div>
      <div class="avatar" style="--el:${elColor(e.el)}"><span>${e.g}</span>${elb}${e.block ? `<div class="blk" ${tipAttr('护体', '优先抵挡伤害。')}>${e.block}</div>` : ''}</div>
      <div class="ename">${e.name}${e.tier !== 'normal' ? `<small>${e.tier === 'boss' ? '劫主' : '妖王'}</small>` : ''}</div>
      ${hpBar(e)}<div class="sts">${statusHtml(e)}</div></div>`;
  }

  /* ================= 顶栏 ================= */
  function topbarHtml() {
    const c = CLASSES[run.cls], rl = REALMS[run.realm];
    return `<header class="topbar">
      <div class="tb-id"><span class="badge" style="--c:${c.color}">${c.g}</span><div><b>${c.name}</b><small>${rl.name} · ${rl.place}${run.asc ? ` · 劫数${run.asc}` : ''}</small></div></div>
      <div class="tb-stats"><span class="hp" ${tipAttr('气血', '归零则陨落。')}>♥ ${run.phase === 'battle' && run.battle ? run.battle.player.hp : run.hp}<small>/${run.maxHp}</small></span><span class="gold" ${tipAttr('灵石', '在坊市购买功法、法宝与丹药。')}>◆ ${run.gold}</span></div>
      <div class="tb-potions">${run.potions.map((p, i) => potionHtml(p, i, true)).join('')}</div>
      <div class="tb-relics">${run.relics.map((id) => relicHtml(id)).join('')}</div>
      <div class="tb-btns"><button class="ib" data-act="deck" ${tipAttr('牌库', '查看当前所有功法')}>牌库<i>${run.deck.length}</i></button><button class="ib" data-act="menu">☰</button></div>
    </header>`;
  }

  /* ================= 各屏幕 ================= */
  function titleHtml() {
    const has = !!XX.loadRun();
    return `<div class="title-screen">
      <div class="moon"></div>
      <svg class="mount m1" viewBox="0 0 800 200" preserveAspectRatio="none"><path d="M0 200 L0 120 L90 60 L170 110 L260 30 L360 120 L450 70 L560 140 L650 50 L740 110 L800 80 L800 200Z"/></svg>
      <svg class="mount m2" viewBox="0 0 800 200" preserveAspectRatio="none"><path d="M0 200 L0 150 L120 90 L220 140 L330 80 L430 150 L540 100 L640 160 L720 110 L800 150 L800 200Z"/></svg>
      <div class="title-box">
        <h1>问道长生</h1>
        <p class="sub">修仙肉鸽 · 卡牌构筑</p>
        <p class="poem">一念入道，万劫不磨。<br>自练气而化神，渡九九天劫，方得飞升。</p>
        <div class="menu">
          ${has ? '<button class="btn primary" data-act="continue">继续修行</button>' : ''}

        </div>

      </div></div>`;
  }
  function selectHtml() {
    const asc = Math.min(ui.asc, meta.maxAsc);

  }
  function metaHtml() {
    const rows = META.map((m) => {
      const l = Meta.level(meta, m.id), max = l >= m.max;
      const dots = m.max > 1 ? `<span class="dots">${Array.from({ length: m.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('')}</span>` : '';
      return `<div class="meta-row ${max ? 'max' : ''}"><div><b>${m.n}</b> ${dots}<p>${m.d}</p></div>
        <button class="btn sm" data-act="buy" data-id="${m.id}" ${max || !Meta.canBuy(meta, m) ? 'disabled' : ''}>${max ? '已达成' : `${m.cost(l)} 道果`}</button></div>`;
    }).join('');
    return `<div class="panel meta-panel"><h2>传承</h2><p class="dao">道果 <b>${meta.dao}</b><small>　每次陨落或飞升都会留下道果，用以强化后世修行。</small></p>${rows}
      <div class="row-btns"><button class="btn primary" data-act="title">返回</button></div></div>`;
  }
  function mapHtml() {
    const map = run.map, avail = new Set(run.availableNodes().map((n) => n.r + '_' + n.c)), done = new Set(run.path);
    const R = XX.MAP_ROWS + 1, W = XX.MAP_W;
    const P = (n) => ({ x: ((n.c + 0.5 + n.jx * 0.6) / W) * 100, y: 100 - ((n.r + 0.5 + n.jy * 0.5) / R) * 100 });
    let lines = '', nodes = '';
    map.forEach((row) => row.forEach((n) => {
      if (!n) return;
      const a = P(n);
      n.next.forEach((c) => {
        const t = map[n.r + 1][c]; if (!t) return;
        const b2 = P(t), on = done.has(n.r + '_' + n.c) && (avail.has(t.r + '_' + t.c) || done.has(t.r + '_' + t.c));

      });
      const key = n.r + '_' + n.c, isCur = run.cur && run.cur.r === n.r && run.cur.c === n.c;

      const name = n.type === 'boss' ? REALMS[run.realm].name + '劫' : NODE_N[n.type];
      nodes += `<button class="node ${n.type} ${st}" style="left:${a.x}%;top:${a.y}%" ${st === 'avail' ? `data-act="node" data-r="${n.r}" data-c="${n.c}"` : 'tabindex="-1"'} ${tipAttr(name, n.type === 'boss' ? '击败劫主，突破境界。' : '')}><span>${n.type === 'boss' ? '劫' : NODE_G[n.type]}</span></button>`;
    }));
    const rl = REALMS[run.realm];
    const legend = ['battle', 'elite', 'event', 'shop', 'rest', 'chest'].map((t) => `<span><i class="node mini ${t}"><span>${NODE_G[t]}</span></i>${NODE_N[t]}</span>`).join('');
    return `<div class="map-screen"><div class="map-head"><h2>${rl.name}期 · ${rl.place}</h2><p>${rl.desc}　选择前路，直至突破境界。</p></div>

  function battleHtml() {

      </div></div>`;

  function rewardHtml() {
    const rw = run.reward, canPot = run.canGainPotion();
    const cards = rw.cardsDone ? '' : `<h3>选择一门功法</h3><div class="card-row">${rw.cards.map((id, i) => cardHtml({ id, up: false }, { attrs: `data-act="rw-card" data-i="${i}"` })).join('')}</div>

      <button class="btn sm" data-act="rw-potion" ${rw.potionTaken || !canPot ? 'disabled' : ''}>${rw.potionTaken ? '已取' : canPot ? '取走' : '丹药栏已满'}</button></div>` : '';
    const rel = rw.relics.length ? `<h3>${rw.relicChoose ? '劫主遗宝 · 择一' : '妖王遗宝'}</h3>` + rw.relics.map((id, i) => `<div class="loot">${relicHtml(id)}<span>${RELICS[id].n}　<small>${RELICS[id].d}</small></span>
      <button class="btn sm" data-act="rw-relic" data-i="${i}" ${rw.relicTaken ? 'disabled' : ''}>${rw.relicTaken ? '—' : '取走'}</button></div>`).join('') : '';
    return `<div class="panel reward"><h2>${run.node && run.node.type === 'boss' ? '劫数已破' : '战胜'}</h2><p class="gold-line">◆ 获得 <b>${rw.gold}</b> 灵石</p>${pot}${rel}${cards}
      <div class="row-btns"><button class="btn primary" data-act="rw-leave">继续前行</button></div></div>`;

  function shopHtml() {

      <h3>功法</h3><div class="shop-row">${s.cards.map((c, i) => item('cards', c, i, cardHtml({ id: c.id, up: false }, { small: true }))).join('')}</div>
      <h3>法宝与丹药</h3><div class="shop-row misc">${s.relics.map((r, i) => item('relics', r, i, `<div class="rl">${relicHtml(r.id)}<b>${RELICS[r.id].n}</b><small>${RELICS[r.id].d}</small></div>`)).join('')}
      ${s.potions.map((p, i) => item('potions', p, i, `<div class="rl">${potionHtml(p.id, 0, false)}<b>${POTIONS[p.id].n}</b><small>${POTIONS[p.id].d}</small></div>`)).join('')}</div>
      <h3>服务</h3><div class="shop-row misc"><div class="shop-item ${s.removed || run.gold < s.removeCost ? 'poor' : ''} ${s.removed ? 'sold' : ''}" data-act="shop-remove"><div class="rl"><span class="relic">焚</span><b>焚经断念</b><small>永久移除牌库中的一张牌</small></div><div class="price">◆ ${s.removeCost}</div></div></div>
      <div class="row-btns"><button class="btn primary" data-act="shop-leave">离开坊市</button></div></div>`;
  }
  function restHtml() {
    const can = run.canRestHeal(), n = Math.floor(run.maxHp * 0.3), ups = run.deck.filter(canUpgrade).length;
    return `<div class="panel restsite"><div class="fire"><i></i><i></i><i></i></div><h2>洞府</h2><p class="flavor">一处僻静洞府，灵气氤氲，可以静心修行。</p>
      <div class="rest-opts"><button class="btn big" data-act="rest-heal" ${can ? '' : 'disabled'}><b>打坐调息</b><small>${can ? `回复 ${n} 点气血（当前 ${run.hp}/${run.maxHp}）` : '业火缠身，无法静坐'}</small></button>
      <button class="btn big" data-act="rest-up" ${ups ? '' : 'disabled'}><b>参悟淬炼</b><small>淬炼一张功法，使其更强</small></button>
      <button class="btn big ghost" data-act="rest-skip"><b>不做停留</b><small>直接上路</small></button></div></div>`;
  }
  function eventHtml() {

    return `<div class="panel event"><h2>${ev.title}</h2><p class="flavor">${ev.text}</p><div class="ev-choices">${ev.choices.map((c, i) => {
      const dis = c.can && !c.can();
      return `<button class="btn big" data-act="ev-choice" data-i="${i}" ${dis ? 'disabled' : ''}>${c.label}${dis ? '（条件不足）' : ''}</button>`;
    }).join('')}</div></div>`;
  }
  function chestHtml() {
    const c = run.chest;
    if (!c.opened) return `<div class="panel chest"><h2>机缘宝箱</h2><div class="chest-box" data-act="chest-open"><span>宝</span></div><p class="flavor">石壁后隐藏着一只古朴的宝箱……</p><button class="btn primary" data-act="chest-open">开启</button></div>`;
    return `<div class="panel chest"><h2>机缘宝箱</h2><p class="gold-line">◆ 获得 <b>${c.gold}</b> 灵石</p>${c.relic ? `<div class="loot">${relicHtml(c.relic)}<span>${RELICS[c.relic].n}　<small>${RELICS[c.relic].d}</small></span></div>` : ''}<button class="btn primary" data-act="chest-leave">继续前行</button></div>`;

  function pickHtml() {

      <div class="card-grid">${sorted.map((c) => cardHtml(c, { small: true, sel: ui.pickSel === c.u, attrs: `data-act="pick-card" data-u="${c.u}"` })).join('')}</div>
      <div class="row-btns"><button class="btn" data-act="pick-skip">${info.back === 'shop' ? '算了' : '放弃'}</button><button class="btn primary" data-act="pick-ok" ${sel ? '' : 'disabled'}>${up ? '淬炼' : '移除'}</button></div></div>`;
  }
  function offerHtml() {
    return `<div class="panel reward"><h2>获得功法</h2><h3>选择一门功法</h3><div class="card-row">${run.offer.ids.map((id, i) => cardHtml({ id, up: false }, { attrs: `data-act="offer" data-i="${i}"` })).join('')}</div>
      <div class="row-btns"><button class="btn" data-act="offer-skip">放弃</button></div></div>`;

  function breakthroughHtml() {

      <div class="ev-choices">${run.btOptions.map((id) => { const o = BREAKTHROUGH.find((x) => x.id === id); return `<button class="btn big" data-act="bt" data-id="${id}"><b>${o.n}</b><small>${o.d}</small></button>`; }).join('')}</div></div>`;
  }

    return `<div class="panel over ${win ? 'win' : 'dead'}"><div class="big-char">${win ? '仙' : '殁'}</div><h2>${win ? '渡劫飞升' : '道消身陨'}</h2>
      <p class="flavor">${win ? '九九天劫尽数化去，你羽化登仙，超脱轮回。' : `你倒在了${rl.name}期的${rl.place}${killer ? `，死于「${killer}」之手` : ''}。`}</p>
      <div class="stats"><div><b>${run.stats.fights}</b><small>战斗</small></div><div><b>${run.stats.elites}</b><small>妖王</small></div><div><b>${run.stats.bosses}</b><small>劫主</small></div><div><b>${run.deck.length}</b><small>功法</small></div><div><b>${run.relics.length}</b><small>法宝</small></div></div>
      <p class="gold-line">获得道果 <b>+${run.daoGained || 0}</b>　<small>（现有 ${meta.dao}）</small></p>
      <div class="row-btns"><button class="btn" data-act="title">主菜单</button><button class="btn primary" data-act="new">再入轮回</button></div></div>`;
  }

  /* ================= 弹窗 ================= */
  function modalHtml() {
    const m = ui.modal; if (!m) return '';
    let body = '';
    if (m.t === 'deck') {
      const order = { atk: 0, skl: 1, pow: 2 };
      const list = run.deck.slice().sort((a, b) => order[CARDS[a.id].type] - order[CARDS[b.id].type] || CARDS[a.id].name.localeCompare(CARDS[b.id].name));
      body = `<h2>牌库 · ${list.length}</h2><div class="card-grid">${list.map((c) => cardHtml(c, { small: true })).join('')}</div>`;
    } else if (m.t === 'pile') {
      const b = run.battle, pile = { draw: b.drawPile, discard: b.discardPile, exhaust: b.exhaustPile }[m.which];
      const list = pile.slice().sort((a, c) => CARDS[a.id].name.localeCompare(CARDS[c.id].name));
      body = `<h2>${{ draw: '抽牌堆', discard: '弃牌堆', exhaust: '消耗堆' }[m.which]} · ${list.length}</h2>${list.length ? `<div class="card-grid">${list.map((c) => cardHtml(c, { small: true, b })).join('')}</div>` : '<p class="flavor">空空如也。</p>'}`;
    } else if (m.t === 'potion') {
      const id = run.potions[m.slot]; if (!id) return '';
      const p = POTIONS[id], b = run.battle, canUse = b && b.phase === 'player' && !ui.busy;
      body = `<h2>${p.n}</h2><p class="flavor">${p.d}</p><div class="row-btns"><button class="btn" data-act="potion-drop" data-slot="${m.slot}">丢弃</button>${canUse ? `<button class="btn primary" data-act="potion-use" data-slot="${m.slot}">使用</button>` : ''}</div>`;
    } else if (m.t === 'menu') {
      body = `<h2>菜单</h2><div class="ev-choices"><button class="btn big" data-act="mute"><b>音效：${ui.muted ? '关' : '开'}</b></button><button class="btn big" data-act="help"><b>玩法说明</b></button><button class="btn big" data-act="save-quit"><b>存档并返回主菜单</b><small>仅在地图上可存档</small></button><button class="btn big danger" data-act="abandon"><b>放弃此世</b><small>视为陨落，结算道果</small></button></div>`;
    } else if (m.t === 'abandon') {
      body = `<h2>放弃此世？</h2><p class="flavor">本世修行将就此终结，已得的道果照常结算。</p><div class="row-btns"><button class="btn" data-act="modal-close">继续修行</button><button class="btn danger" data-act="abandon-yes">确认放弃</button></div>`;
    } else if (m.t === 'help') {
      body = helpHtml();
    }
    return `<div class="modal" data-act="modal-bg"><div class="modal-box">${body}<button class="x" data-act="modal-close">×</button></div></div>`;
  }
  function helpHtml() {
    return `<h2>玩法说明</h2><div class="help">
      <p><b>目标：</b>自练气至化神，历经五大境界，每境界结尾击败劫主完成突破，最终渡过<b>九九天劫</b>飞升。</p>
      <p><b>地图：</b>每个境界一张分支地图，自下而上前进。节点有<b>妖兽</b>、<b>妖王</b>（精英）、<b>奇遇</b>、<b>坊市</b>、<b>洞府</b>（回血/淬炼）与<b>机缘宝箱</b>。</p>
      <p><b>战斗：</b>每回合获得灵力，打出功法牌。敌人头顶显示其意图。<b>护体</b>抵挡伤害，回合开始时清空。</p>
      <p><b>五行：</b>木→火→土→金→水→木相生。若上一张打出的牌五行<b>生</b>本牌（如先木后火），触发<b>相生</b>：伤害与护体 +50%，部分功法有额外效果。卡牌所属五行克制敌人属性时，伤害 +30%（木克土、土克水、水克火、火克金、金克木）。</p>
      <p><b>状态：</b>剑意（增伤）、身法（增护体）、虚弱、易伤、破防、中毒、灼烧、眩晕……悬停可查看说明。</p>
      <p><b>成长：</b>战斗后选取功法、法宝、丹药；洞府可淬炼功法；坊市可焚经断念精简牌库。</p>
      <p><b>传承：</b>每次陨落或飞升都会留下<b>道果</b>，可在「传承」中永久强化、解锁道途。飞升后可挑战更高<b>劫数</b>。</p>
      <p><b>操作：</b>点击卡牌出牌（需要目标时再点击敌人）；数字键 1–9 选牌，<kbd>E</kbd> 结束回合，<kbd>Esc</kbd> 取消。触屏设备点一次选牌、再点一次打出。</p></div>`;
  }

  /* ================= 主渲染 ================= */
  function render() {
    settle();
    const inRun = run && ui.screen === 'run';
    let html;
    if (ui.screen === 'select') html = '<main class="screen">' + selectHtml() + '</main>';
    else if (ui.screen === 'meta') html = '<main class="screen">' + metaHtml() + '</main>';
    else if (!inRun) html = titleHtml();
    else html = topbarHtml() + '<main class="screen">' + screenFor() + '</main>';
    D.body.dataset.realm = inRun ? run.realm : -1;
    D.body.dataset.phase = inRun ? run.phase : ui.screen;
    const old = app.querySelector('.screen');
    const keepScroll = old ? old.scrollTop : 0;
    app.innerHTML = html + modalHtml();
    const sc = app.querySelector('.screen');
    if (sc) {
      // 阶段/地图位置变化时滚动到关注点，否则保持滚动位置
      const key = inRun ? run.phase + '|' + run.realm + '|' + (run.path ? run.path.length : 0) : '';
      if (key !== ui.viewKey) {
        ui.viewKey = key;
        const a = inRun && run.phase === 'map' && sc.querySelector('.node.avail');
        if (a) a.scrollIntoView({ block: 'center' }); else sc.scrollTop = 0;
      } else sc.scrollTop = keepScroll;
    }
    if (inRun && run.phase === 'battle' && run.battle) afterBattleRender();
    else ui.lastBattle = null;
  }
  function screenFor() {
    switch (run.phase) {
      case 'map': return mapHtml();
      case 'battle': return battleHtml();
      case 'reward': return rewardHtml();
      case 'shop': return shopHtml();
      case 'rest': return restHtml();
      case 'event': return eventHtml();
      case 'chest': return chestHtml();
      case 'pick': return pickHtml();
      case 'cards': return offerHtml();
      case 'breakthrough': return breakthroughHtml();
      case 'over': return overHtml();
      default: return '';
    }
  }
  function settle() {
    if (run && run.phase === 'over' && !run.settled) {
      run.settled = true;
      run.daoGained = Meta.finish(meta, run);
      XX.clearRun();
      sfx(run.outcome === 'win' ? 'win' : 'lose');
    }
  }
  function after() {
    if (run && run.phase === 'map') XX.saveRun(run);
    render();
  }

  /* ================= 战斗特效 ================= */
  function afterBattleRender() {
    const b = run.battle;
    if (ui.lastBattle !== b) { ui.lastBattle = b; ui.lastTurn = 0; }
    if (b.turn !== ui.lastTurn && b.phase === 'player') { ui.lastTurn = b.turn; banner(b.turn === 1 ? '战斗开始' : `第 ${b.turn} 回合`); }
    b.fresh.clear();
    fitHand();
    playFx(b.drainFx());
  }
  /** 手牌按可用宽度动态计算重叠，牌少时完全展开 */
  function fitHand() {
    const hand = app.querySelector('.hand'); if (!hand) return;
    const cards = hand.querySelectorAll('.card'), n = cards.length; if (n < 2) return;
    const cw = cards[0].offsetWidth, over = n * cw - (hand.clientWidth - 16);
    hand.style.setProperty('--m', (over > 0 ? -Math.min(cw * 0.55, over / (2 * n)) : 2).toFixed(1) + 'px');
  }
  G.addEventListener('resize', fitHand);
  function banner(text) {
    const el = D.createElement('div'); el.className = 'banner'; el.textContent = text;
    fxLayer.appendChild(el); setTimeout(() => el.remove(), 1300);
  }
  function popAt(uid, text, cls) {
    const t = app.querySelector(`[data-uid="${uid}"] .avatar`) || app.querySelector(`[data-uid="${uid}"]`); if (!t) return;
    const r = t.getBoundingClientRect(), el = D.createElement('div');
    el.className = 'pop ' + cls; el.textContent = text;
    el.style.left = (r.left + r.width / 2 + (Math.random() - 0.5) * 36) + 'px'; el.style.top = (r.top + r.height * 0.25) + 'px';
    fxLayer.appendChild(el); setTimeout(() => el.remove(), 1100);
  }
  function playFx(list) {
    let delay = 0;
    list.forEach((f) => {
      const w = f.who && f.who.uid;
      const run1 = (fn) => setTimeout(fn, delay);
      switch (f.t) {
        case 'dmg':
          if (f.n > 0 || f.blocked) {
            run1(() => {
              popAt(w, f.n > 0 ? '-' + f.n : '挡', f.n > 0 ? (f.who.isPlayer ? 'dmg-p' : 'dmg') : 'pblk');
              const el = app.querySelector(`[data-uid="${w}"]`); if (el) { el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 350); }
              sfx(f.n > 0 ? (f.who.isPlayer ? 'hurt' : 'hit') : 'block');
              if (f.who.isPlayer && f.n > 0) { D.body.classList.add('shake'); setTimeout(() => D.body.classList.remove('shake'), 300); }
            });
            delay += 60;
          }
          break;
        case 'block': run1(() => { popAt(w, '+' + f.n + ' 护', 'pblk'); sfx('block'); }); delay += 40; break;
        case 'heal': run1(() => { popAt(w, '+' + f.n, 'heal'); sfx('heal'); }); delay += 40; break;
        case 'status': if (f.n) run1(() => popAt(w, `${STATUS[f.k].n} ${f.n > 0 ? '+' : ''}${f.n}`, STATUS[f.k].good === (f.n > 0 ? 1 : 0) || (STATUS[f.k].good && f.n > 0) ? 'buff' : 'debuff')); delay += 40; break;
        case 'text': run1(() => { popAt(w, f.s, f.k || 'buff'); if (f.k === 'sheng') sfx('sheng'); }); delay += 60; break;
        case 'lunge': run1(() => { const el = app.querySelector(`[data-uid="${w}"]`); if (el && f.atk) { el.classList.add('lunge'); setTimeout(() => el.classList.remove('lunge'), 450); } if (f.name) popAt(w, f.name, 'move'); }); break;
        case 'die': run1(() => { const el = app.querySelector(`[data-uid="${w}"]`); if (el) el.classList.add('dying'); }); break;
      }
    });
  }

  /* ================= 战斗操作 ================= */
  async function finishBattleUI() {
    const b = run.battle;
    ui.busy = true; render();
    await sleep(b.result === 'win' ? 800 : 1200);
    ui.busy = false; ui.sel = null; ui.potSel = null;
    if (b.result === 'win') sfx('win');
    run.finishBattle();
    after();
  }
  function playIdx(i, target) {
    const b = run.battle, r = b.playCard(i, target);
    if (!r.ok) return;
    ui.sel = null; sfx('card');
    render();
    if (b.phase === 'over') finishBattleUI();
  }
  function onCard(i) {
    const b = run.battle; if (ui.busy || b.phase !== 'player') return;
    const c = b.hand[i], chk = b.canPlay(i);
    if (!chk.ok) { if (chk.reason) popAt('p', chk.reason, 'debuff'); return; }
    const touch = G.matchMedia && G.matchMedia('(hover: none)').matches;
    if (b.needsTarget(c) && b.alive().length > 1) { ui.sel = ui.sel === i ? null : i; ui.potSel = null; render(); return; }
    if (touch && ui.sel !== i) { ui.sel = i; render(); return; }
    playIdx(i, null);
  }
  function onEnemy(uid) {
    const b = run.battle; if (ui.busy || b.phase !== 'player') return;
    const e = b.enemies.find((x) => x.uid === uid); if (!e || e.dead) return;
    if (ui.sel != null) playIdx(ui.sel, e);
    else if (ui.potSel != null) { const s = ui.potSel; ui.potSel = null; b.usePotion(s, e); sfx('heal'); render(); if (b.phase === 'over') finishBattleUI(); }
  }
  async function endTurnUI() {
    const b = run.battle; if (ui.busy || b.phase !== 'player') return;
    ui.busy = true; ui.sel = null; ui.potSel = null; sfx('ui');
    b.endTurn(); render();
    if (b.phase === 'over') { ui.busy = false; return finishBattleUI(); }
    banner('敌方行动');
    while (b.phase === 'enemy') {
      await sleep(720);
      const r = b.stepEnemy(); render();
      if (r !== 'more') break;
    }
    ui.busy = false;
    render();
    if (b.phase === 'over') await finishBattleUI();
  }

  /* ================= 事件分发 ================= */
  function startRun() {
    run = Run.create({ cls: ui.cls, asc: Math.min(ui.asc, meta.maxAsc), meta });
    ui.screen = 'run'; ui.sel = ui.potSel = null; ui.modal = null;
    sfx('ui'); after();
  }
  const actions = {
    title() { ui.screen = 'title'; ui.modal = null; if (run && run.phase === 'over') run = null; render(); },
    new() { run = null; ui.screen = 'select'; ui.modal = null; ui.asc = Math.min(ui.asc, meta.maxAsc); render(); },
    continue() { const r = XX.loadRun(); if (!r) return; run = r; ui.screen = 'run'; after(); },
    meta() { ui.screen = 'meta'; render(); },
    help() { ui.modal = { t: 'help' }; render(); },
    'pick-class'(el) { ui.cls = el.dataset.cls; render(); },
    'asc-'() { ui.asc = Math.max(0, ui.asc - 1); render(); },
    'asc+'() { ui.asc = Math.min(meta.maxAsc, ui.asc + 1); render(); },
    start() { startRun(); },
    buy(el) { if (Meta.buy(meta, el.dataset.id)) sfx('buy'); render(); },
    node(el) { sfx('ui'); run.enterNode(+el.dataset.r, +el.dataset.c); ui.sel = ui.potSel = null; render(); },
    card(el) { onCard(+el.dataset.i); },
    enemy(el) { onEnemy(el.dataset.uid); },
    end() { endTurnUI(); },
    cancel() { ui.sel = null; ui.potSel = null; render(); },
    pile(el) { ui.modal = { t: 'pile', which: el.dataset.which }; render(); },
    deck() { ui.modal = { t: 'deck' }; render(); },
    menu() { ui.modal = { t: 'menu' }; render(); },
    mute() { ui.muted = !ui.muted; try { G.localStorage.setItem('xianxia.muted', ui.muted ? '1' : '0'); } catch (e) { /* ignore */ } render(); },
    'modal-close'() { ui.modal = null; render(); },
    'modal-bg'(el, ev) { if (ev.target === el) { ui.modal = null; render(); } },
    potion(el) { ui.modal = { t: 'potion', slot: +el.dataset.slot }; render(); },
    'potion-drop'(el) { run.discardPotion(+el.dataset.slot); ui.modal = null; render(); },
    'potion-use'(el) {
      const slot = +el.dataset.slot, b = run.battle, id = run.potions[slot], p = POTIONS[id];
      ui.modal = null;
      if (p.target && b.alive().length > 1) { ui.potSel = slot; ui.sel = null; render(); return; }
      b.usePotion(slot, null); sfx('heal'); render();
      if (b.phase === 'over') finishBattleUI();
    },
    'save-quit'() { if (run.phase === 'map') XX.saveRun(run); ui.modal = null; ui.screen = 'title'; render(); },
    abandon() { ui.modal = { t: 'abandon' }; render(); },
    'abandon-yes'() { run.killedBy = ''; run.battle = null; run.lose(); ui.modal = null; ui.sel = ui.potSel = null; render(); },
    'rw-card'(el) { run.rewardPickCard(+el.dataset.i); sfx('buy'); render(); },
    'rw-skip'() { run.rewardSkipCards(); render(); },
    'rw-potion'() { run.rewardTakePotion(); sfx('buy'); render(); },
    'rw-relic'(el) { run.rewardTakeRelic(+el.dataset.i); sfx('buy'); render(); },
    'rw-leave'() { run.rewardLeave(); after(); },
    'buy-cards'(el) { if (run.shopBuy('cards', +el.dataset.i)) { sfx('buy'); render(); } },
    'buy-relics'(el) { if (run.shopBuy('relics', +el.dataset.i)) { sfx('buy'); render(); } },
    'buy-potions'(el) { if (run.shopBuy('potions', +el.dataset.i)) { sfx('buy'); render(); } },
    'shop-remove'() { if (run.shopRemove()) { ui.pickSel = null; sfx('buy'); render(); } },
    'shop-leave'() { run.shopLeave(); after(); },
    'rest-heal'() { sfx('heal'); run.restHeal(); after(); },
    'rest-up'() { ui.pickSel = null; run.restUpgrade(); render(); },
    'rest-skip'() { run.advance(); after(); },
    'ev-choice'(el) { run.eventChoose(+el.dataset.i); render(); },
    'ev-go'() { run.eventContinue(); ui.pickSel = null; after(); },
    'chest-open'() { run.openChest(); sfx('buy'); render(); },
    'chest-leave'() { run.chestLeave(); after(); },
    'pick-card'(el) { ui.pickSel = +el.dataset.u; render(); },
    'pick-ok'() { if (ui.pickSel == null) return; run.pickChoose(ui.pickSel); ui.pickSel = null; sfx('buy'); after(); },
    'pick-skip'() { ui.pickSel = null; run.pickSkip(); after(); },
    offer(el) { run.offerChoose(+el.dataset.i); sfx('buy'); after(); },
    'offer-skip'() { run.offerSkip(); after(); },
    bt(el) { run.breakthroughChoose(el.dataset.id); sfx('win'); after(); },
  };
  D.addEventListener('click', (ev) => {
    if (ev.target.closest('.modal-box') && !ev.target.closest('[data-act]')) return;
    const el = ev.target.closest('[data-act]');
    if (!el) { if (ui.sel != null && !ev.target.closest('.hud, .enemy')) { ui.sel = null; render(); } return; }
    const fn = actions[el.dataset.act];
    if (!fn) return;
    if (el.disabled) return;
    fn(el, ev);
  });
  D.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { if (ui.modal) { ui.modal = null; render(); } else if (ui.sel != null || ui.potSel != null) { ui.sel = ui.potSel = null; render(); } return; }
    if (!run || ui.screen !== 'run' || run.phase !== 'battle' || ui.modal) return;
    if (ev.key === 'e' || ev.key === 'E' || ev.key === 'Enter') { endTurnUI(); return; }
    const n = parseInt(ev.key, 10);
    if (n >= 1 && n <= 9) onCard(n - 1);
  });

  /* ================= 悬浮提示 ================= */
  function showTip(t, x, y) {
    const [name, desc] = t.getAttribute('data-tip').split('|');
    tipEl.innerHTML = `<b>${name}</b>${desc ? `<span>${desc}</span>` : ''}`;
    tipEl.style.display = 'block';
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    tipEl.style.left = Math.max(6, Math.min(G.innerWidth - w - 6, x + 14)) + 'px';
    tipEl.style.top = Math.max(6, Math.min(G.innerHeight - h - 6, y + 16)) + 'px';
  }
  D.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); else tipEl.style.display = 'none'; });
  D.addEventListener('mousemove', (e) => { if (tipEl.style.display === 'block') { const t = e.target.closest('[data-tip]'); if (t) showTip(t, e.clientX, e.clientY); else tipEl.style.display = 'none'; } });
  let tipTimer = null;
  D.addEventListener('touchstart', (e) => {
    const t = e.target.closest('[data-tip]'); if (!t) { tipEl.style.display = 'none'; return; }
    const r = t.getBoundingClientRect(); showTip(t, r.left, r.bottom);
    clearTimeout(tipTimer); tipTimer = setTimeout(() => (tipEl.style.display = 'none'), 2500);
  }, { passive: true });

  /* ================= 启动 ================= */
  XX.ui = { render, ui, actions, get run() { return run; }, get meta() { return meta; }, setRun(r) { run = r; ui.screen = 'run'; ui.sel = ui.potSel = null; ui.modal = null; } }; // setRun 仅供测试脚本使用
  render();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
